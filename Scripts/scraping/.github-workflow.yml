# Copiar este archivo a .github/workflows/scraping-semanal.yml en el repo de scripts
name: Scraping semanal de prospectos — Proaudita

on:
  schedule:
    - cron: '0 12 * * 1'  # Lunes 09:00 AM Chile (UTC-3)
  workflow_dispatch:       # Permite correr manualmente desde GitHub

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r Scripts/scraping/requirements.txt

      - name: Correr scraping
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python Scripts/scraping/call_apify_proaudita.py

      - name: Subir CSV como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: leads_*.csv
          retention-days: 30
