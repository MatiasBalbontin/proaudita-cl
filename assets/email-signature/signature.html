<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: white; }

  .sig {
    width: 540px;
    padding: 20px 0 0 0;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    border-top: 2px solid #0019FF;
  }

  .top {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 16px;
  }

  .logo-wrap svg {
    width: 110px;
    height: auto;
    display: block;
  }

  .divider {
    width: 1px;
    height: 48px;
    background: #E5E7EB;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .name-block {}

  .name {
    font-size: 15px;
    font-weight: 700;
    color: #0D0D2B;
    letter-spacing: -0.2px;
    line-height: 1.2;
  }

  .title {
    font-size: 11.5px;
    color: #6B7280;
    margin-top: 3px;
    letter-spacing: 0.1px;
  }

  .contact-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 10px;
    border-top: 1px solid #F3F4F6;
    padding-top: 10px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #6B7280;
    text-decoration: none;
  }

  .contact-item .icon {
    width: 13px;
    height: 13px;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .contact-item .val {
    color: #374151;
    font-weight: 500;
  }

  .contact-item a {
    color: #374151;
    text-decoration: none;
  }
</style>
